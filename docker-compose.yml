services:
  savers:
    build: .
    ports:
      - "8080:8080"
    environment:
      ADDR: ":8080"
      DB_PATH: /data/savers.db
      STATIC_DIR: /app/static
      TZ: Asia/Shanghai
      JWT_SECRET: savers-compose-secret
    volumes:
      - savers-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  savers-data:
